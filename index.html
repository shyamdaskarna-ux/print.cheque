<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIMB Cheque Printing System</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 20px;
    }

    /* १. Login Screen Style */
    .login-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #1e293b;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .login-box {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      width: 320px;
      text-align: center;
    }

    .login-box h2 {
      margin-top: 0;
      color: #0f172a;
    }

    .login-input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
    }

    .login-btn {
      width: 100%;
      padding: 10px;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }

    .login-btn:hover {
      background-color: #0369a1;
    }

    /* चेकको साइज र ब्याकग्राउन्ड */
    .cheque-container {
      width: 208mm;
      height: 87mm;
      position: relative;
      margin: 10px auto;
      border: 1px solid #ccc;
      background-image: url('CHQ Demo.jpg'); 
      background-size: 100% 100%;
      background-repeat: no-repeat;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
    }

    .field {
      position: absolute;
    }

    /* मितिका ८ वटा कोठाहरू (१२mm बायाँ सारिएको) */
    .date-container {
      top: 8.5mm;
      right: 9.8mm;
      display: flex;
      gap: 1.88mm;
    }

    .date-box {
      width: 4.4mm;
      height: 5.8mm;
      text-align: center;
      font-size: 16px;
      font-weight: bold;
      border: none;
      background: transparent;
      outline: none;
      padding: 0;
      margin: 0;
      line-height: 5.8mm;
    }

    /* पाने व्यक्तिको नाम */
    .payee-field {
      top: 24.5mm;
      left: 22mm;
      width: 135mm;
    }

    .payee-field input {
      width: 100%;
      font-size: 15px;
      font-weight: bold;
    }

    /* रकम अक्षरमा */
    .words-field {
      top: 32.5mm;
      left: 22mm;
      width: 120mm;
    }

    .words-field input {
      width: 100%;
      font-size: 14.5px;
      font-weight: bold;
    }

    /* रकम अङ्कमा */
    .amount-field {
      top: 32.5mm;
      right: 10.5mm;
      width: 45mm;
    }

    .amount-field input {
      width: 100%;
      font-size: 16px;
      text-align: right;
      padding-right: 2mm;
      font-weight: bold;
      box-sizing: border-box;
      letter-spacing: 0.5px;
    }

    input {
      border: none;
      background: transparent;
      outline: none;
      color: #000;
    }

    /* कन्ट्रोल बटन र पपअप स्टाइल */
    .controls {
      text-align: center;
      margin: 20px 0;
    }

    .btn {
      padding: 10px 20px;
      font-size: 15px;
      margin: 0 5px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      color: white;
      font-weight: bold;
    }

    .btn-print { background-color: #0056b3; }
    .btn-save { background-color: #28a745; }
    .btn-view { background-color: #17a2b8; }
    .btn-excel { background-color: #1e7e34; }
    .btn-clear { background-color: #dc3545; }
    .btn-close { background-color: #6c757d; }
    .btn-logout { background-color: #475569; }

    .modal {
      display: none; 
      position: fixed; 
      z-index: 1000; 
      left: 0;
      top: 0;
      width: 100%; 
      height: 100%; 
      background-color: rgba(0,0,0,0.5); 
    }

    .modal-content {
      background-color: #fff;
      margin: 5% auto;
      padding: 20px;
      border-radius: 8px;
      width: 80%;
      max-height: 80vh;
      overflow-y: auto;
    }

    .history-table {
      width: 100%;
      margin-top: 15px;
      border-collapse: collapse;
      background: white;
    }

    .history-table th, .history-table td {
      border: 1px solid #ddd;
      padding: 8px 10px;
      text-align: left;
    }

    .history-table th {
      background-color: #0056b3;
      color: white;
    }

    /* History Table Input Style */
    .chq-input-table {
      width: 100%;
      padding: 5px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
      background-color: #f8fafc;
    }

    .chq-input-table:focus {
      background-color: #ffffff;
      border-color: #0284c7;
      outline: none;
    }

    #mainApp {
      display: none;
    }

    @media print {
      body {
        background: none;
        padding: 0;
      }
      .cheque-container {
        border: none;
        background-image: none !important;
      }
      .no-print, .modal, .login-overlay {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- १. Login Screen Overlay -->
  <div id="loginOverlay" class="login-overlay no-print">
    <div class="login-box">
      <h2>चेक लेखन System Login</h2>
      <input type="text" id="username" class="login-input" placeholder="Username">
      <input type="password" id="password" class="login-input" placeholder="Password">
      <button class="login-btn" onclick="checkLogin()">Login</button>
      <p id="errorMsg" style="color: red; font-size: 13px; display: none; margin-top: 10px;">गलत Username वा Password!</p>
    </div>
  </div>

  <!-- २. Main Cheque Application -->
  <div id="mainApp">
    <div class="cheque-container">
      <!-- मितिका ८ वटा कोठाहरू -->
      <div class="field date-container">
        <input type="text" maxlength="1" class="date-box" onkeyup="handleDateInput(event, this, 0)">
        <input type="text" maxlength="1" class="date-box" onkeyup="handleDateInput(event, this, 1)">
        <input type="text" maxlength="1" class="date-box" onkeyup="handleDateInput(event, this, 2)">
        <input type="text" maxlength="1" class="date-box" onkeyup="handleDateInput(event, this, 3)">
        <input type="text" maxlength="1" class="date-box" onkeyup="handleDateInput(event, this, 4)">
        <input type="text" maxlength="1" class="date-box" onkeyup="handleDateInput(event, this, 5)">
        <input type="text" maxlength="1" class="date-box" onkeyup="handleDateInput(event, this, 6)">
        <input type="text" maxlength="1" class="date-box" onkeyup="handleDateInput(event, this, 7)">
      </div>

      <!-- पाने व्यक्तिको नाम Dropdown सहित -->
      <div class="field payee-field">
        <input type="text" id="payeeName" list="payeeList" placeholder="Payee Name">
        <datalist id="payeeList"></datalist>
      </div>

      <!-- रकम अक्षरमा -->
      <div class="field words-field">
        <input type="text" id="amountWords" placeholder="Amount in Words" readonly>
      </div>

      <!-- रकम अङ्कमा -->
      <div class="field amount-field">
        <input type="text" id="amountNum" placeholder="0.00" oninput="formatAndConvertAmount(this)">
      </div>
    </div>

    <!-- बटनहरू -->
    <div class="controls no-print">
      <button class="btn btn-print" onclick="printAndSave()">Print & Save</button>
      <button class="btn btn-save" onclick="saveRecord()">Save Record Only</button>
      <button class="btn btn-view" onclick="openHistoryModal()">View History</button>
      <button class="btn btn-logout" onclick="logout()">Logout</button>
    </div>
  </div>

  <!-- Cheque History Modal -->
  <div id="historyModal" class="modal no-print">
    <div class="modal-content">
      <h2>Cheque Issue History (सेभ गरिएका चेकहरू)</h2>
      
      <div style="margin-bottom: 15px;">
        <button class="btn btn-excel" onclick="exportToExcel()">Export to Excel</button>
        <button class="btn btn-clear" onclick="clearHistory()">Clear History</button>
        <button class="btn btn-close" onclick="closeHistoryModal()" style="float: right;">Close</button>
      </div>

      <table class="history-table" id="chequeTable">
        <thead>
          <tr>
            <th style="width: 5%;">SN</th>
            <th style="width: 20%;">Cheque No.</th>
            <th style="width: 15%;">Date</th>
            <th style="width: 35%;">Payee Name</th>
            <th style="width: 25%;">Amount (NPR)</th>
          </tr>
        </thead>
        <tbody id="historyBody">
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Security Login System
    const CORRECT_USER = "shyam";
    const CORRECT_PASS = "9863614407";

    function checkLogin() {
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');

      if (user === CORRECT_USER && pass === CORRECT_PASS) {
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        loadPayeeDropdown();
      } else {
        errorMsg.style.display = 'block';
      }
    }

    function logout() {
      document.getElementById('loginOverlay').style.display = 'flex';
      document.getElementById('mainApp').style.display = 'none';
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
      document.getElementById('errorMsg').style.display = 'none';
    }

    document.getElementById('password').addEventListener('keyup', function(e) {
      if (e.key === 'Enter') checkLogin();
    });

    // मिति Typing logic
    function handleDateInput(e, current, index) {
      const boxes = document.querySelectorAll('.date-box');
      
      if (e.key === "Backspace" && index > 0 && current.value === "") {
        boxes[index - 1].focus();
      } else if (current.value.length === 1 && index < boxes.length - 1) {
        boxes[index + 1].focus();
      }
    }

    // Comma Formatting
    function formatNepaliCurrency(numStr) {
      if (!numStr) return '';
      
      let parts = numStr.toString().split('.');
      let integerPart = parts[0].replace(/\D/g, '');
      let decimalPart = parts.length > 1 ? '.' + parts[1].replace(/\D/g, '').substring(0, 2) : '';

      if (!integerPart) return '';

      let lastThree = integerPart.substring(integerPart.length - 3);
      let otherNumbers = integerPart.substring(0, integerPart.length - 3);
      
      if (otherNumbers !== '') {
        lastThree = ',' + lastThree;
      }
      
      let formattedInteger = otherNumbers.replace(/\B(?=(\d{2})+(?!\d))/g, ",") + lastThree;

      return formattedInteger + decimalPart;
    }

    function formatAndConvertAmount(input) {
      let rawVal = input.value.replace(/,/g, '');
      
      if (rawVal === '') {
        input.value = '';
        document.getElementById('amountWords').value = '';
        return;
      }

      input.value = formatNepaliCurrency(rawVal);
      convertToWords(rawVal);
    }

    // Number to Words Conversion
    function convertToWords(amountVal) {
      const wordsInput = document.getElementById('amountWords');

      if (!amountVal || parseFloat(amountVal) <= 0) {
        wordsInput.value = '';
        return;
      }

      const parts = amountVal.toString().split('.');
      let rupees = parseInt(parts[0], 10);
      let paisa = parts[1] ? parseInt(parts[1].substring(0, 2), 10) : 0;

      if (parts[1] && parts[1].length === 1) paisa *= 10;

      let words = '';

      if (rupees > 0) {
        words += numberToWords(rupees);
      }

      if (paisa > 0) {
        if (words !== '') {
          words += ' & Paisa ' + numberToWords(paisa) + ' Only.';
        } else {
          words += 'Paisa ' + numberToWords(paisa) + ' Only.';
        }
      } else {
        words += (rupees === 1) ? ' Rupee Only.' : ' Rupees Only.';
      }

      wordsInput.value = words;
    }

    function numberToWords(n) {
      const a = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
      const b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];

      let num = parseInt(n);
      if (isNaN(num) || num === 0) return '';

      let str = '';

      if (num >= 10000000) {
        str += numberToWords(Math.floor(num / 10000000)) + ' Crore ';
        num %= 10000000;
      }
      if (num >= 100000) {
        str += numberToWords(Math.floor(num / 100000)) + ' Lakh ';
        num %= 100000;
      }
      if (num >= 1000) {
        str += numberToWords(Math.floor(num / 1000)) + ' Thousand ';
        num %= 1000;
      }
      if (num >= 100) {
        str += numberToWords(Math.floor(num / 100)) + ' Hundred ';
        num %= 100;
      }
      if (num > 0) {
        if (num < 20) {
          str += a[num] + ' ';
        } else {
          str += b[Math.floor(num / 10)] + ' ' + a[num % 10] + ' ';
        }
      }

      return str.trim();
    }

    // Data Management
    function getDateString() {
      const boxes = document.querySelectorAll('.date-box');
      let dt = '';
      boxes.forEach(b => dt += b.value);
      return dt;
    }

    function clearForm() {
      const boxes = document.querySelectorAll('.date-box');
      boxes.forEach(b => b.value = '');
      document.getElementById('payeeName').value = '';
      document.getElementById('amountNum').value = '';
      document.getElementById('amountWords').value = '';
      if(boxes.length > 0) boxes[0].focus();
    }

    function saveRecord() {
      const payee = document.getElementById('payeeName').value.trim();
      const amount = document.getElementById('amountNum').value;
      const dateStr = getDateString();

      if (!payee || !amount) {
        alert('कृपया नाम र रकम भर्नुहोस्!');
        return false;
      }

      let payees = JSON.parse(localStorage.getItem('cheque_payees')) || [];
      if (!payees.includes(payee)) {
        payees.push(payee);
        localStorage.setItem('cheque_payees', JSON.stringify(payees));
        loadPayeeDropdown();
      }

      let history = JSON.parse(localStorage.getItem('cheque_history')) || [];
      history.push({ chequeNo: '', date: dateStr, payee: payee, amount: amount });
      localStorage.setItem('cheque_history', JSON.stringify(history));

      alert('Record Saved Successfully!');
      return true;
    }

    function updateChequeNo(index, value) {
      let history = JSON.parse(localStorage.getItem('cheque_history')) || [];
      if (history[index]) {
        history[index].chequeNo = value;
        localStorage.setItem('cheque_history', JSON.stringify(history));
      }
    }

    function loadPayeeDropdown() {
      let payees = JSON.parse(localStorage.getItem('cheque_payees')) || [];
      let datalist = document.getElementById('payeeList');
      datalist.innerHTML = '';
      payees.forEach(p => {
        let option = document.createElement('option');
        option.value = p;
        datalist.appendChild(option);
      });
    }

    function openHistoryModal() {
      loadHistoryTable();
      document.getElementById('historyModal').style.display = 'block';
    }

    function closeHistoryModal() {
      document.getElementById('historyModal').style.display = 'none';
    }

    function loadHistoryTable() {
      let history = JSON.parse(localStorage.getItem('cheque_history')) || [];
      let tbody = document.getElementById('historyBody');
      tbody.innerHTML = '';

      history.forEach((rec, index) => {
        let chqNo = rec.chequeNo || '';
        let row = `<tr>
          <td>${index + 1}</td>
          <td><input type="text" class="chq-input-table" value="${chqNo}" placeholder="Enter Cheque No." onchange="updateChequeNo(${index}, this.value)"></td>
          <td>${rec.date}</td>
          <td>${rec.payee}</td>
          <td>${rec.amount}</td>
        </tr>`;
        tbody.innerHTML += row;
      });
    }

    function exportToExcel() {
      let history = JSON.parse(localStorage.getItem('cheque_history')) || [];
      if (history.length === 0) {
        alert("डाउनलोड गर्नको लागि कुनै रेकर्ड छैन!");
        return;
      }

      let excelData = history.map((item, index) => ({
        "S.N.": index + 1,
        "Cheque No.": item.chequeNo || '',
        "Date": item.date,
        "Payee Name": item.payee,
        "Amount (NPR)": item.amount
      }));

      let worksheet = XLSX.utils.json_to_sheet(excelData);
      let workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Cheque History");

      XLSX.writeFile(workbook, "Cheque_Issue_History.xlsx");
    }

    function printAndSave() {
      if (saveRecord()) {
        window.print();
      }
    }

    window.onafterprint = function() {
      clearForm();
    };

    function clearHistory() {
      if (confirm("के तपाईँ सेभ भएका सबै डेटा मेटाउन चाहनुहुन्छ?")) {
        localStorage.removeItem('cheque_history');
        localStorage.removeItem('cheque_payees');
        loadPayeeDropdown();
        loadHistoryTable();
      }
    }
  </script>

</body>
</html>
